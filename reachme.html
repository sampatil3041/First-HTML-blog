<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reach Me</title>
</head>
<body>
    <p><h1>Agar aapko hamse mulakat karni hai toh aapko niche diya gaya bahut bada form submit karna hoga</h1></p>
    <big>
    <form action="">
    <label for="Name">Enter your name:-</label>
    <input type="text" name="Name" id="Name" placeholder="name"><br>
    <h4>Select your Gender</h4> 
    <label for="gender">Male</label>
    <input type="radio" name="gender" id="gender">
    <label for="female">Female</label>
    <input type="radio" name="gender" id="female">
    <label for="other">Other</label>
    <input type="radio" name="gender" id="other"> <br>
    <label for="dob">Enter date of birth</label>
    <input type="date" name="dob" id="dob">
    <br>
    <label for="location">Select your location</label>
    <select name="location" id="location">
        <option value="Jalgaon">Jalgaon</option>
        <option value="Saharsa">Saharsa</option>
        <option value="Kanpur">Kanpur</option>
        <option value="Auriya">Auriya</option>
    </select> <br>

    <p>What you like to eat</p>
    <label for="fruit">Fruits</label>
    <input type="checkbox" name="fruits" id="fruits"><br>
    <label for="vegetables">Vegetables</label>
    <input type="checkbox" name="vegetables" id="vegetables"><br>
    <label for="non veg">Non veg</label>
    <input type="checkbox" name="non veg" id="non veg"> <br>

    <label for="description">Describe yourself</label>
    <textarea name="description" id="description">
        Tell me about yourself
    </textarea><br>

    <input type="submit" name="submit" id="submit">
    </form>
    </big>
</body>
</html>
